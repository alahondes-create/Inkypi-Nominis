<div class="form-group">
    <label for="api_key" class="form-label">Clé API Mistral (LeChat) :</label>
    <input type="password" id="api_key" name="api_key" placeholder="Votre clé API Mistral" class="form-input">
    <small class="form-text">
        <strong>Obligatoire.</strong> Obtenez votre clé sur <a href="https://console.mistral.ai/" target="_blank">Mistral Console</a>.
        Alternative : variable <code>MISTRAL_API_KEY</code> dans .env
    </small>
</div>

<div class="form-group">
    <label for="model" class="form-label">Modèle Mistral :</label>
    <select id="model" name="model" class="form-select">
        <option value="mistral-medium">mistral-medium (recommandé)</option>
        <option value="mistral-large">mistral-large (plus précis)</option>
        <option value="mistral-small">mistral-small (plus rapide)</option>
    </select>
</div>

<div class="form-group">
    <label for="word_limit" class="form-label">Nombre de mots maximum :</label>
    <input type="number" id="word_limit" name="word_limit" min="10" max="200" value="50" class="form-input">
</div>

<div class="form-group">
    <label for="style" class="form-label">Style littéraire :</label>
    <select id="style" name="style" class="form-select">
        <option value="simple">Style Simple</option>
        <option value="claudel">Paul Claudel</option>
        <option value="hugo">Victor Hugo</option>
        <option value="flaubert">Gustave Flaubert</option>
        <option value="baudelaire">Charles Baudelaire</option>
        <option value="proust">Marcel Proust</option>
        <option value="zola">Émile Zola</option>
        <option value="verlaine">Paul Verlaine</option>
        <option value="rimbaud">Arthur Rimbaud</option>
        <option value="balzac">Honoré de Balzac</option>
    </select>
</div>

<div class="form-group">
    <label for="font_size" class="form-label">Taille de police :</label>
    <input type="number" id="font_size" name="font_size" min="0.05" max="0.3" step="0.01" value="0.1" class="form-input">
</div>

<div class="form-group">
    <label class="form-check-label">
        <input type="checkbox" id="show_date" name="show_date" checked class="form-check-input">
        Afficher la date
    </label>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (loadPluginSettings) {
            document.getElementById('api_key').value = pluginSettings.api_key || '';
            document.getElementById('model').value = pluginSettings.model || 'mistral-medium';
            document.getElementById('word_limit').value = pluginSettings.word_limit || '50';
            document.getElementById('style').value = pluginSettings.style || 'simple';
            document.getElementById('font_size').value = pluginSettings.font_size || '0.1';
            document.getElementById('show_date').checked = pluginSettings.show_date !== 'false';
        }
    });
</script>
